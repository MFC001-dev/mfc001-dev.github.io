<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0e0e1a;
            padding: 20px;
        }

        .container {
            background: #18182b;
            border-radius: 28px;
            padding: 44px 32px 36px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a42;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 16px;
            right: 20px;
            display: flex;
            gap: 6px;
            background: #22223a;
            padding: 4px;
            border-radius: 20px;
            border: 1px solid #3a3a5a;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #666688;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .lang-btn.active {
            background: #3d3d66;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .lang-btn:hover:not(.active) {
            color: #aaaacc;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: #8888aa;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 500;
            font-size: 17px;
            color: #fff;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-white {
            background: #2d2d50;
            border-color: #44446a;
        }
        .btn-white:hover {
            background: #3a3a62;
            border-color: #5a5a8a;
        }

        .btn-vpn {
            background: #2d1f3a;
            border-color: #4a2a5a;
        }
        .btn-vpn:hover {
            background: #3d2a4a;
            border-color: #5a3a6a;
        }

        .btn .emoji {
            font-size: 20px;
        }

        .note {
            color: #555577;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px 28px;
                border-radius: 24px;
            }
            .lang-switch {
                top: 12px;
                right: 14px;
            }
            .lang-btn {
                font-size: 12px;
                padding: 5px 11px;
            }
            h1 {
                font-size: 22px;
            }
            .btn {
                font-size: 15px;
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="en">EN</button>
        </div>

        <div id="ru">
            <span class="icon">🛡️</span>
            <h1>Доступные подписки</h1>
            <p class="subtitle">Выберите и активируйте одним нажатием</p>

            <div class="btn-group">
                <a href="happ://add/white" class="btn btn-white">
                    <span class="emoji">⬜</span>
                    Белые списки
                </a>

                <a href="happ://add/vpn" class="btn btn-vpn">
                    <span class="emoji">🔵</span>
                    Обычный впн
                </a>
            </div>

            <p class="note">📱 Нажми на кнопку — Happ откроется автоматически</p>
        </div>

        <div id="en" class="hidden">
            <span class="icon">🛡️</span>
            <h1>Available subscriptions</h1>
            <p class="subtitle">Select and activate with one tap</p>

            <div class="btn-group">
                <a href="happ://add/white" class="btn btn-white">
                    <span class="emoji">⬜</span>
                    White lists
                </a>

                <a href="happ://add/vpn" class="btn btn-vpn">
                    <span class="emoji">🔵</span>
                    Regular VPN
                </a>
            </div>

            <p class="note">📱 Tap the button — Happ will open automatically</p>
        </div>
    </div>

    <script>
        const langBtns = document.querySelectorAll('.lang-btn');
        const ruBlock = document.getElementById('ru');
        const enBlock = document.getElementById('en');

        langBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                langBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const lang = this.dataset.lang;
                if (lang === 'ru') {
                    ruBlock.classList.remove('hidden');
                    enBlock.classList.add('hidden');
                } else {
                    ruBlock.classList.add('hidden');
                    enBlock.classList.remove('hidden');
                }
            });
        });
    </script>

</body>
</html>
