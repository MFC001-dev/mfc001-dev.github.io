    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0e0e1a;
            padding: 20px;
        }

        .container {
            background: #18182b;
            border-radius: 28px;
            padding: 44px 32px 36px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a42;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: #8888aa;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 500;
            font-size: 17px;
            color: #fff;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-white {
            background: #2d2d50;
            border-color: #44446a;
        }
        .btn-white:hover {
            background: #3a3a62;
            border-color: #5a5a8a;
        }

        .btn-vpn {
            background: #2d1f3a;
            border-color: #4a2a5a;
        }
        .btn-vpn:hover {
            background: #3d2a4a;
            border-color: #5a3a6a;
        }

        .btn .emoji {
            font-size: 20px;
        }

        .note {
            color: #555577;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px 28px;
                border-radius: 24px;
            }
            h1 {
                font-size: 22px;
            }
            .btn {
                font-size: 15px;
                padding: 16px 20px;
            }
        }
    </style>
</head>
