<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписки Happ</title>
    <style>
        /* ===== ОБНУЛЕНИЕ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b1a;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== АНИМИРОВАННЫЙ ФОН ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, #1a1040 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 50%, #2d1b69 0%, transparent 60%),
                        radial-gradient(ellipse at 50% 100%, #1a0a2e 0%, transparent 50%);
            z-index: 0;
            animation: bgFloat 15s ease-in-out infinite alternate;
        }

        @keyframes bgFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, 5%) scale(1.05); }
        }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 36px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ИКОНКА ===== */
        .icon {
            font-size: 52px;
            margin-bottom: 12px;
            display: block;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* ===== ЗАГОЛОВКИ ===== */
        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 32px;
        }

        /* ===== КНОПКИ ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Кнопка 1 — Белые списки */
        .btn-white {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
        }
        .btn-white:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(108, 92, 231, 0.45);
        }

        /* Кнопка 2 — Обычный впн */
        .btn-vpn {
            background: linear-gradient(135deg, #fd79a8 0%, #e17055 100%);
            box-shadow: 0 4px 20px rgba(225, 112, 85, 0.3);
        }
        .btn-vpn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(225, 112, 85, 0.45);
        }

        /* Эмодзи в кнопках */
        .btn .emoji {
            font-size: 22px;
            line-height: 1;
        }

        .btn .badge {
            background: rgba(255,255,255,0.15);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-left: auto;
        }

        /* ===== ФУТЕР ===== */
        .footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .note {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            line-height: 1.5;
        }

        .note span {
            display: inline-block;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00b894;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .container {
                padding: 32px 20px 28px;
                border-radius: 24px;
            }
            h1 {
                font-size: 24px;
            }
            .btn {
                font-size: 15px;
                padding: 16px 20px;
            }
            .icon {
                font-size: 44px;
            }
        }
    </style>
</head>
